schema_version: 1

context:
  name: opentelemetry-instrumentation-mcp
  version: "0.63.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_mcp-${{ version }}.tar.gz
  sha256: 32d36d043a531273272c79ec0e87260a5dc876656d394ada311a691a8cc3fd53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.63b1
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - mcp >=1.26.0,<2

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.mcp
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: OpenTelemetry mcp instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - dillonroach
    - timkpaine
